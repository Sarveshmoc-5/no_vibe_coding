<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
        margin: 0;
        background-color: #f0f0f0;
        font-family: Times, sans-serif;
        display: flex;
        align-items: center;
    }


    #side-pan {
        width: 300px;
        height: 300px;
        background-color: #fac400df;
        border: 1px solid #ccc;
        padding-bottom: 290px;
        padding-right: 300px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        display: flex;
        width: 500px;
        height: 400px;
        background-image: url("side-bg.png");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;


    }

    #login-side {
        background-color: #2931368e;
        margin: 20px 100px 20px 200px;
        height: 500px;
        width: 500px;
        display: flex;
        align-items: center;
        border-radius: 10px;
    }

    #logo {
        width: 80px;
        height: 80px;

    }

 
</style>

<body>
    <div id="side-pan">
    </div>
    <form id="form">
    <div id="login-side">
        <h1 align="center">Login</h1>
        <input type="text" id="un" name="username" placeholder="Username"><br><br>
        <input type="password" id="up" name="password" placeholder="Password"><br><br>
        <button type="button" onclick="getinfo()">Sign In</button>
    </div>
    </form>
</body>
<script>
    function getinfo() {
        var username = document.getElementById("un").value;
        var password = document.getElementById("up").value;
        return display_info(username, password);

    }
    function display_info(username, password){
if (username === "sarvesh" && password === "12345") {
        window.location.href = "dashboard.html";
        } else {
            alert("Invalid username or password");
        }}
</script>

</html>
